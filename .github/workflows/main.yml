name: Build Mod Jar
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          gradle build
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      - name: Upload Jar
        uses: actions/upload-artifact@v3
        with:
          name: Mod-Jar
          path: build/libs/*.jar
